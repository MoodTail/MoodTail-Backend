name: moodtail-be CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/moodtail-be:latest

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Server
        uses: appleboy/ssh-action@master
        with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              set -e
              
              mkdir -p ~/app
              
              if ! command -v docker >/dev/null 2>&1; then
                echo "Docker is not installed. Installing Docker..."
              
                sudo apt-get update
                sudo apt-get install -y ca-certificates curl gnupg
              
                sudo install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                sudo chmod a+r /etc/apt/keyrings/docker.gpg
              
                echo \
                  "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                  $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                  sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              
                sudo apt-get update
                sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              
                sudo systemctl enable docker
                sudo systemctl start docker
              fi
              
              sudo docker --version
              sudo docker compose version

      - name: Copy docker-compose.yml to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd ~/app

            cat > .env <<'EOF'
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}

            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            SPRING_DATA_REDIS_HOST=${{ secrets.SPRING_DATA_REDIS_HOST }}
            SPRING_DATA_REDIS_PORT=${{ secrets.SPRING_DATA_REDIS_PORT }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            JWT_REFRESH_COOKIE_NAME=${{ secrets.JWT_REFRESH_COOKIE_NAME }}
            JWT_REFRESH_COOKIE_PATH=${{ secrets.JWT_REFRESH_COOKIE_PATH }}
            JWT_REFRESH_COOKIE_DOMAIN=${{ secrets.JWT_REFRESH_COOKIE_DOMAIN }}
            JWT_COOKIE_SECURE=${{ secrets.JWT_COOKIE_SECURE }}
            JWT_COOKIE_SAME_SITE=${{ secrets.JWT_COOKIE_SAME_SITE }}

            KAKAO_OAUTH_ENABLED=${{ secrets.KAKAO_OAUTH_ENABLED }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}

            OAUTH_STATE_EXPIRATION=${{ secrets.OAUTH_STATE_EXPIRATION }}
            OAUTH_CONNECT_TIMEOUT=${{ secrets.OAUTH_CONNECT_TIMEOUT }}
            OAUTH_READ_TIMEOUT=${{ secrets.OAUTH_READ_TIMEOUT }}
            GUEST_LOGIN_CLIENT_IP_HEADER=${{ secrets.GUEST_LOGIN_CLIENT_IP_HEADER }}
            GUEST_DEFAULT_NICKNAME=${{ secrets.GUEST_DEFAULT_NICKNAME }}
            GUEST_LOGIN_RATE_MAX_ATTEMPTS=${{ secrets.GUEST_LOGIN_RATE_MAX_ATTEMPTS }}
            GUEST_LOGIN_RATE_WINDOW=${{ secrets.GUEST_LOGIN_RATE_WINDOW }}
            GUEST_LOGIN_CLIENT_RATE_MAX_ATTEMPTS=${{ secrets.GUEST_LOGIN_CLIENT_RATE_MAX_ATTEMPTS }}
            GUEST_LOGIN_CLIENT_RATE_WINDOW=${{ secrets.GUEST_LOGIN_CLIENT_RATE_WINDOW }}
            AUTH_LOCK_TTL=${{ secrets.AUTH_LOCK_TTL }}
            AUTH_LOCK_RETRY_INTERVAL=${{ secrets.AUTH_LOCK_RETRY_INTERVAL }}
            AUTH_LOCK_ACQUIRE_TIMEOUT=${{ secrets.AUTH_LOCK_ACQUIRE_TIMEOUT }}
            SOCIAL_LOGIN_REGISTRATION_MAX_ATTEMPTS=${{ secrets.SOCIAL_LOGIN_REGISTRATION_MAX_ATTEMPTS }}
            AUTH_REDIS_KEY_PREFIX=${{ secrets.AUTH_REDIS_KEY_PREFIX }}

            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            CORS_MAX_AGE=${{ secrets.CORS_MAX_AGE }}
            USAGE_TIMEOUT=${{ secrets.USAGE_TIMEOUT }}
            EOF

            chmod 600 .env

            sudo docker compose --env-file .env pull
            sudo docker compose --env-file .env up -d
            sudo docker image prune -f

            sudo docker ps
