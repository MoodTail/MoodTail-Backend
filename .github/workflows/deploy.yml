name: moodtail-be CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew clean build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/moodtail-be:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/moodtail-be:latest

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/app
            mkdir -p ~/app/monitoring/prometheus/runtime
            sudo chown -R "$USER:$USER" ~/app/monitoring
            if [ -f ~/app/monitoring/prometheus/runtime/grafana-cloud-token ]; then
              chmod 600 ~/app/monitoring/prometheus/runtime/grafana-cloud-token
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed. Installing Docker..."

              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg

              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg

              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            sudo docker --version
            sudo docker compose version

      - name: Debug - check all secrets for newlines
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import os
          keys = ["IMAGE_TAG","DATABASE_HOST","DATABASE_NAME","DATABASE_USERNAME","DATABASE_PASSWORD",
                  "DOCKERHUB_USERNAME","SERVER_URL","SPRING_DATA_REDIS_HOST","JWT_SECRET",
                  "CORS_ALLOWED_ORIGINS","AWS_S3_BUCKET","AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY"]
          for key in keys:
              value = os.environ.get(key, "")
              bad = ("\n" in value) or ("\r" in value) or ("\0" in value)
              print(f"{key}: length={len(value)}, has_bad_char={bad}")
          PY

      - name: Create deployment environment file
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL || 'http://localhost:8080' }}
          SHARE_FRONTEND_BASE_URL: ${{ secrets.SHARE_FRONTEND_BASE_URL || 'http://localhost:5173' }}
          OPEN_WEATHER_API_KEY: ${{ secrets.OPEN_WEATHER_API_KEY }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT: ${{ secrets.SPRING_DATA_REDIS_PORT || '6379' }}
          SPRING_DATA_REDIS_CONNECT_TIMEOUT: ${{ vars.SPRING_DATA_REDIS_CONNECT_TIMEOUT || '2s' }}
          SPRING_DATA_REDIS_TIMEOUT: ${{ vars.SPRING_DATA_REDIS_TIMEOUT || '2s' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_COOKIE_DOMAIN: ${{ vars.JWT_REFRESH_COOKIE_DOMAIN }}
          KAKAO_OAUTH_ENABLED: ${{ vars.KAKAO_OAUTH_ENABLED || 'false' }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          GOOGLE_OAUTH_ENABLED: ${{ vars.GOOGLE_OAUTH_ENABLED || 'false' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          PASSWORD_RESET_ENABLED: ${{ vars.PASSWORD_RESET_ENABLED || 'false' }}
          PASSWORD_RESET_PEPPER: ${{ secrets.PASSWORD_RESET_PEPPER }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_SMTP_AUTH: ${{ vars.MAIL_SMTP_AUTH || 'true' }}
          MAIL_STARTTLS_ENABLED: ${{ vars.MAIL_STARTTLS_ENABLED || 'true' }}
          MAIL_STARTTLS_REQUIRED: ${{ vars.MAIL_STARTTLS_REQUIRED || 'true' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION}}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          keys = tuple(key for key in os.environ if key not in {
              "CI", "HOME", "PATH", "PWD", "RUNNER_OS", "SHLVL"
          } and key in {
              "IMAGE_TAG", "DATABASE_HOST", "DATABASE_NAME", "DATABASE_USERNAME", "DATABASE_PASSWORD","SERVER_URL",
              "SHARE_BASE_URL", "SHARE_FRONTEND_BASE_URL",
              "DOCKERHUB_USERNAME", "SPRING_DATA_REDIS_HOST", "SPRING_DATA_REDIS_PORT",
              "SPRING_DATA_REDIS_CONNECT_TIMEOUT", "SPRING_DATA_REDIS_TIMEOUT", "JWT_SECRET",
              "JWT_REFRESH_COOKIE_DOMAIN", "KAKAO_OAUTH_ENABLED", "KAKAO_CLIENT_ID",
              "KAKAO_CLIENT_SECRET", "KAKAO_REDIRECT_URI", "GOOGLE_OAUTH_ENABLED", "GOOGLE_CLIENT_ID",
              "GOOGLE_CLIENT_SECRET", "GOOGLE_REDIRECT_URI",
              "PASSWORD_RESET_ENABLED", "PASSWORD_RESET_PEPPER", "MAIL_HOST",
              "MAIL_PORT", "MAIL_USERNAME", "MAIL_PASSWORD", "MAIL_FROM", "MAIL_SMTP_AUTH",
              "MAIL_STARTTLS_ENABLED", "MAIL_STARTTLS_REQUIRED",
              "CORS_ALLOWED_ORIGINS",
              "AWS_S3_BUCKET", "AWS_REGION", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "OPEN_WEATHER_API_KEY", 
              
          })
          required = {
              "IMAGE_TAG", "DATABASE_HOST", "DATABASE_NAME", "DATABASE_USERNAME", "DATABASE_PASSWORD",
              "DOCKERHUB_USERNAME", "SPRING_DATA_REDIS_HOST", "JWT_SECRET", "CORS_ALLOWED_ORIGINS",
              "AWS_S3_BUCKET", "OPEN_WEATHER_API_KEY", "SHARE_BASE_URL", "SHARE_FRONTEND_BASE_URL"
          }
          if os.environ.get("GOOGLE_OAUTH_ENABLED", "").lower() == "true":
              required.update({"GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REDIRECT_URI"})
          if os.environ.get("KAKAO_OAUTH_ENABLED", "").lower() == "true":
              required.update({"KAKAO_CLIENT_ID", "KAKAO_REDIRECT_URI"})
          if os.environ.get("PASSWORD_RESET_ENABLED", "").lower() == "true":
              required.update({"PASSWORD_RESET_PEPPER", "MAIL_HOST", "MAIL_FROM"})
              if os.environ.get("MAIL_SMTP_AUTH", "").lower() == "true":
                  required.update({"MAIL_USERNAME", "MAIL_PASSWORD"})
          has_access_key = bool(os.environ.get("AWS_ACCESS_KEY_ID"))
          has_secret_key = bool(os.environ.get("AWS_SECRET_ACCESS_KEY"))
          if has_access_key != has_secret_key:
              raise SystemExit(
                  "AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be configured together"
              )
          missing = sorted(key for key in required if not os.environ.get(key))
          if missing:
              raise SystemExit("Missing required deployment values: " + ", ".join(missing))

          def dotenv_quote(value: str) -> str:
              if any(character in value for character in ("\n", "\r", "\0")):
                  raise SystemExit("Deployment values must not contain newline or NUL characters")
              return "'" + value.replace("'", "\\'") + "'"

          content = "\n".join(f"{key}={dotenv_quote(os.environ.get(key, ''))}" for key in sorted(keys)) + "\n"
          Path("deploy.env").write_text(content, encoding="utf-8")
          PY
          chmod 644 deploy.env

      - name: Create monitoring runtime files
        env:
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_PROMETHEUS_TOKEN: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          remote_write_url = os.environ.get("GRAFANA_CLOUD_PROMETHEUS_URL", "").strip()
          username = os.environ.get("GRAFANA_CLOUD_PROMETHEUS_USERNAME", "").strip()
          token = os.environ.get("GRAFANA_CLOUD_PROMETHEUS_TOKEN", "")

          values = {
              "GRAFANA_CLOUD_PROMETHEUS_URL": remote_write_url,
              "GRAFANA_CLOUD_PROMETHEUS_USERNAME": username,
              "GRAFANA_CLOUD_PROMETHEUS_TOKEN": token,
          }
          missing = sorted(key for key, value in values.items() if not value)
          if missing:
              raise SystemExit("Missing monitoring secrets: " + ", ".join(missing))

          for key, value in values.items():
              if any(character in value for character in ("\n", "\r", "\0")):
                  raise SystemExit(f"{key} must not contain newline or NUL characters")

          parsed_url = urlparse(remote_write_url)
          if (
              parsed_url.scheme != "https"
              or not parsed_url.hostname
              or not parsed_url.hostname.endswith(".grafana.net")
              or not parsed_url.path.endswith("/api/prom/push")
          ):
              raise SystemExit("GRAFANA_CLOUD_PROMETHEUS_URL is not a Grafana Cloud remote_write URL")
          if not (username.isascii() and username.isdigit()):
              raise SystemExit("GRAFANA_CLOUD_PROMETHEUS_USERNAME must be a numeric metrics instance ID")
          if token != token.strip() or any(character.isspace() for character in token):
              raise SystemExit("GRAFANA_CLOUD_PROMETHEUS_TOKEN must not contain whitespace")

          template_path = Path("monitoring/prometheus/prometheus.yml")
          runtime_directory = Path("monitoring/prometheus/runtime")
          runtime_directory.mkdir(parents=True, exist_ok=True)

          config = template_path.read_text(encoding="utf-8")
          replacements = {
              "__GRAFANA_CLOUD_PROMETHEUS_URL__": remote_write_url,
              "__GRAFANA_CLOUD_PROMETHEUS_USERNAME__": username,
          }
          for placeholder, value in replacements.items():
              if config.count(placeholder) != 1:
                  raise SystemExit(f"Expected exactly one {placeholder} placeholder")
              config = config.replace(placeholder, value)

          runtime_config = runtime_directory / "prometheus.yml"
          runtime_token = runtime_directory / "grafana-cloud-token"
          runtime_config.write_text(config, encoding="utf-8")
          runtime_token.write_text(token, encoding="utf-8")
          runtime_config.chmod(0o644)
          runtime_token.chmod(0o600)
          PY

      - name: Copy deployment files to Server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.monitoring.yml,deploy.env,monitoring/prometheus/runtime/prometheus.yml,monitoring/prometheus/runtime/grafana-cloud-token,monitoring/container-metrics/collect-container-metrics.sh,monitoring/container-metrics/moodtail-container-metrics.service,monitoring/container-metrics/moodtail-container-metrics.timer"
          target: "~/app"

      - name: Deploy to Server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd ~/app
            docker_compose() {
              sudo docker compose \
                --env-file .env \
                -f docker-compose.yml \
                -f docker-compose.monitoring.yml \
                "$@"
            }

            mv deploy.env .env
            chmod 600 .env

            chmod 644 monitoring/prometheus/runtime/prometheus.yml
            sudo chown 65534:65534 monitoring/prometheus/runtime/grafana-cloud-token
            sudo chmod 400 monitoring/prometheus/runtime/grafana-cloud-token
            sudo -u '#65534' -- test -r monitoring/prometheus/runtime/prometheus.yml
            sudo -u '#65534' -- test -r monitoring/prometheus/runtime/grafana-cloud-token

            sudo install -d -m 0755 /var/lib/moodtail-monitoring/textfile
            sudo install -m 0755 \
              monitoring/container-metrics/collect-container-metrics.sh \
              /usr/local/bin/moodtail-container-metrics
            sudo install -m 0644 \
              monitoring/container-metrics/moodtail-container-metrics.service \
              /etc/systemd/system/moodtail-container-metrics.service
            sudo install -m 0644 \
              monitoring/container-metrics/moodtail-container-metrics.timer \
              /etc/systemd/system/moodtail-container-metrics.timer
            sudo systemctl daemon-reload

            docker_compose pull
            docker_compose run --rm --no-deps \
              --entrypoint /bin/promtool \
              prometheus-agent check config /etc/prometheus/prometheus.yml
            docker_compose up -d --remove-orphans

            healthy=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 \
                http://localhost:9091/actuator/health >/dev/null \
                && curl --silent --show-error --output /dev/null --max-time 5 \
                  http://localhost:8080/; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != "true" ]; then
              docker_compose logs --tail=200 moodtail-app prometheus-agent node-exporter
              exit 1
            fi

            if ! curl --fail --silent --show-error --max-time 10 \
              http://localhost:9091/actuator/prometheus \
              | grep -q '^jvm_memory_used_bytes'; then
              docker_compose logs --tail=200 moodtail-app prometheus-agent
              exit 1
            fi

            running_services=$(docker_compose ps --status running --services)
            for service in moodtail-app prometheus-agent node-exporter; do
              if ! printf '%s\n' "$running_services" | grep -qx "$service"; then
                docker_compose logs --tail=200 "$service"
                exit 1
              fi
            done

            sudo systemctl enable --now moodtail-container-metrics.timer
            sudo systemctl start moodtail-container-metrics.service

            sudo docker image prune -f

            sudo docker ps
