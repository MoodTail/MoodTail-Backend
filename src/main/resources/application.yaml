spring:
  application:
    name: moodtail
  profiles:
    active: local
  config:
    import: "optional:file:./.env[.properties]"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:3306/${DATABASE_NAME:moodtail}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      enabled: true

management:
  server:
    port: 9091
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: "health,prometheus"
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${MONITORING_ENVIRONMENT:${spring.profiles.active}}

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: WARN
    com.example.moodtail: INFO
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.zalando.logbook.Logbook: TRACE

logbook:
  format:
    style: json
  predicate:
    include:
      - path: /api/**
      - path: /share/**
    exclude:
      - path: /**
        methods:
          - OPTIONS
  obfuscate:
    replacement: "<masked>"
    headers:
      - Authorization
      - Proxy-Authorization
      - Cookie
      - Set-Cookie
    parameters:
      - access_token
      - refresh_token
      - token
      - code
      - email
      - authorizationCode
      - signupToken
      - resetToken
      - state
    json-body-fields:
      - password
      - passwordConfirm
      - newPassword
      - newPasswordConfirm
      - accessToken
      - refreshToken
      - signupToken
      - resetToken
      - authorizationCode
      - state
      - codeChallenge
      - email
      - contactEmail
      - nickname
      - guestUuid
      - uuid
      - memo
  write:
    max-body-size: 16384

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

jwt:
  secret: ${JWT_SECRET}
  accessExpiration: 900000
  refreshExpiration: 1209600000

auth:
  refresh-cookie:
    name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    domain: ${JWT_REFRESH_COOKIE_DOMAIN:}
    secure: ${JWT_COOKIE_SECURE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  oauth:
    state-expiration-millis: 300000
    signup-token-expiration-millis: 600000
    connect-timeout-millis: 3000
    read-timeout-millis: 5000
    state-rate-limit:
      max-attempts: 10
      window-millis: 60000
    kakao:
      enabled: ${KAKAO_OAUTH_ENABLED:false}
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${GOOGLE_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
  guest-login:
    default-nickname: 게스트
    uuid-rate-limit:
      max-attempts: 10
      window-millis: 60000
    client-rate-limit:
      max-attempts: 60
      window-millis: 60000
  redis:
    key-prefix: ${AUTH_REDIS_KEY_PREFIX:moodtail:local:auth:}
  local:
    password:
      min-length: 8
      max-bytes: 72
    login:
      max-failed-attempts: 5
      lock-duration-millis: 900000
    password-reset:
      enabled: ${PASSWORD_RESET_ENABLED:false}
      sender: ${MAIL_FROM:}
      subject: MoodTail password reset code
      body-template: Your MoodTail password reset code is %s.
      pepper: ${PASSWORD_RESET_PEPPER:}
      code-expiration-millis: 300000
      token-expiration-millis: 600000
      resend-cooldown-millis: 60000
      max-verification-attempts: 5
      client-rate-limit:
        max-attempts: 10
        window-millis: 600000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  max-age: 3600

app:
  server-url: ${SERVER_URL:http://localhost:8080}
  share:
    base-url: ${SHARE_BASE_URL:http://localhost:8080}
    frontend-base-url: ${SHARE_FRONTEND_BASE_URL:http://localhost:5173}
  usage:
    timeout: ${USAGE_TIMEOUT:30}

open-weather:
  base-url: https://api.openweathermap.org
  api-key: ${OPEN_WEATHER_API_KEY:}
  connect-timeout-millis: 5000
  read-timeout-millis: 5000
