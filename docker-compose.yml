services:
  moodtail-app:
    container_name: MoodTail-server
    image: ${DOCKERHUB_USERNAME}/moodtail-be:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}

      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}

      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - JWT_REFRESH_COOKIE_NAME=${JWT_REFRESH_COOKIE_NAME:-refreshToken}
      - JWT_REFRESH_COOKIE_PATH=${JWT_REFRESH_COOKIE_PATH:-/}
      - JWT_REFRESH_COOKIE_DOMAIN=${JWT_REFRESH_COOKIE_DOMAIN:-}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-true}
      - JWT_COOKIE_SAME_SITE=${JWT_COOKIE_SAME_SITE:-Lax}

      - KAKAO_OAUTH_ENABLED=${KAKAO_OAUTH_ENABLED:-true}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - KAKAO_TOKEN_URI=${KAKAO_TOKEN_URI:-https://kauth.kakao.com/oauth/token}
      - KAKAO_USER_INFO_URI=${KAKAO_USER_INFO_URI:-https://kapi.kakao.com/v2/user/me}

      - OAUTH_STATE_EXPIRATION=${OAUTH_STATE_EXPIRATION:-300000}
      - OAUTH_CONNECT_TIMEOUT=${OAUTH_CONNECT_TIMEOUT:-3000}
      - OAUTH_READ_TIMEOUT=${OAUTH_READ_TIMEOUT:-5000}
      - GUEST_LOGIN_CLIENT_IP_HEADER=${GUEST_LOGIN_CLIENT_IP_HEADER:-}
      - GUEST_DEFAULT_NICKNAME=${GUEST_DEFAULT_NICKNAME:-게스트}
      - GUEST_LOGIN_RATE_MAX_ATTEMPTS=${GUEST_LOGIN_RATE_MAX_ATTEMPTS:-10}
      - GUEST_LOGIN_RATE_WINDOW=${GUEST_LOGIN_RATE_WINDOW:-60000}
      - GUEST_LOGIN_CLIENT_RATE_MAX_ATTEMPTS=${GUEST_LOGIN_CLIENT_RATE_MAX_ATTEMPTS:-60}
      - GUEST_LOGIN_CLIENT_RATE_WINDOW=${GUEST_LOGIN_CLIENT_RATE_WINDOW:-60000}
      - AUTH_LOCK_TTL=${AUTH_LOCK_TTL:-10000}
      - AUTH_LOCK_RETRY_INTERVAL=${AUTH_LOCK_RETRY_INTERVAL:-25}
      - AUTH_LOCK_ACQUIRE_TIMEOUT=${AUTH_LOCK_ACQUIRE_TIMEOUT:-3000}
      - SOCIAL_LOGIN_REGISTRATION_MAX_ATTEMPTS=${SOCIAL_LOGIN_REGISTRATION_MAX_ATTEMPTS:-3}
      - AUTH_REDIS_KEY_PREFIX=${AUTH_REDIS_KEY_PREFIX:-moodtail:prod:auth:}

      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_MAX_AGE=${CORS_MAX_AGE:-3600}
      - USAGE_TIMEOUT=${USAGE_TIMEOUT}
    deploy:
      resources:
        limits:
          memory: 600M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
