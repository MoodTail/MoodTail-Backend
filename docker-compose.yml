services:
  moodtail-app:
    container_name: MoodTail-server
    image: ${DOCKERHUB_USERNAME}/moodtail-be:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=false

      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_DATA_REDIS_CONNECT_TIMEOUT=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:-2s}
      - SPRING_DATA_REDIS_TIMEOUT=${SPRING_DATA_REDIS_TIMEOUT:-2s}

      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}

      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - JWT_REFRESH_COOKIE_NAME=${JWT_REFRESH_COOKIE_NAME:-refreshToken}
      - JWT_REFRESH_COOKIE_DOMAIN=${JWT_REFRESH_COOKIE_DOMAIN:-}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-true}
      - JWT_COOKIE_SAME_SITE=${JWT_COOKIE_SAME_SITE:-Lax}
      - SECURITY_LOG_LEVEL=${SECURITY_LOG_LEVEL:-INFO}

      - KAKAO_OAUTH_ENABLED=${KAKAO_OAUTH_ENABLED:-false}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - KAKAO_TOKEN_URI=${KAKAO_TOKEN_URI:-https://kauth.kakao.com/oauth/token}
      - KAKAO_USER_INFO_URI=${KAKAO_USER_INFO_URI:-https://kapi.kakao.com/v2/user/me}

      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_TOKEN_URI=${GOOGLE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      - GOOGLE_USER_INFO_URI=${GOOGLE_USER_INFO_URI:-https://openidconnect.googleapis.com/v1/userinfo}

      - AUTH_REDIS_KEY_PREFIX=${AUTH_REDIS_KEY_PREFIX:-moodtail:prod:auth:}

      - PASSWORD_RESET_ENABLED=${PASSWORD_RESET_ENABLED:-false}
      - PASSWORD_RESET_PEPPER=${PASSWORD_RESET_PEPPER:-}
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-true}
      - MAIL_STARTTLS_ENABLED=${MAIL_STARTTLS_ENABLED:-true}
      - MAIL_STARTTLS_REQUIRED=${MAIL_STARTTLS_REQUIRED:-true}

      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    deploy:
      resources:
        limits:
          memory: 600M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
