services:
  moodtail-app:
    container_name: MoodTail-server
    image: ${DOCKERHUB_USERNAME}/moodtail-be:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_DATA_REDIS_CONNECT_TIMEOUT=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:-2s}
      - SPRING_DATA_REDIS_TIMEOUT=${SPRING_DATA_REDIS_TIMEOUT:-2s}

      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}

      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - JWT_REFRESH_COOKIE_NAME=${JWT_REFRESH_COOKIE_NAME:-refreshToken}
      - JWT_REFRESH_COOKIE_PATH=${JWT_REFRESH_COOKIE_PATH:-/}
      - JWT_REFRESH_COOKIE_DOMAIN=${JWT_REFRESH_COOKIE_DOMAIN:-}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-true}
      - JWT_COOKIE_SAME_SITE=${JWT_COOKIE_SAME_SITE:-Lax}
      - SECURITY_LOG_LEVEL=${SECURITY_LOG_LEVEL:-INFO}

      - KAKAO_OAUTH_ENABLED=${KAKAO_OAUTH_ENABLED:-false}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - KAKAO_TOKEN_URI=${KAKAO_TOKEN_URI:-https://kauth.kakao.com/oauth/token}
      - KAKAO_USER_INFO_URI=${KAKAO_USER_INFO_URI:-https://kapi.kakao.com/v2/user/me}

      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_TOKEN_URI=${GOOGLE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      - GOOGLE_USER_INFO_URI=${GOOGLE_USER_INFO_URI:-https://openidconnect.googleapis.com/v1/userinfo}

      - OAUTH_STATE_EXPIRATION=${OAUTH_STATE_EXPIRATION:-300000}
      - OAUTH_CONNECT_TIMEOUT=${OAUTH_CONNECT_TIMEOUT:-3000}
      - OAUTH_READ_TIMEOUT=${OAUTH_READ_TIMEOUT:-5000}
      - OAUTH_STATE_RATE_MAX_ATTEMPTS=${OAUTH_STATE_RATE_MAX_ATTEMPTS:-10}
      - OAUTH_STATE_RATE_WINDOW=${OAUTH_STATE_RATE_WINDOW:-60000}
      - GUEST_LOGIN_CLIENT_IP_HEADER=${GUEST_LOGIN_CLIENT_IP_HEADER:-}
      - GUEST_DEFAULT_NICKNAME=${GUEST_DEFAULT_NICKNAME:-게스트}
      - GUEST_LOGIN_RATE_MAX_ATTEMPTS=${GUEST_LOGIN_RATE_MAX_ATTEMPTS:-10}
      - GUEST_LOGIN_RATE_WINDOW=${GUEST_LOGIN_RATE_WINDOW:-60000}
      - GUEST_LOGIN_CLIENT_RATE_MAX_ATTEMPTS=${GUEST_LOGIN_CLIENT_RATE_MAX_ATTEMPTS:-60}
      - GUEST_LOGIN_CLIENT_RATE_WINDOW=${GUEST_LOGIN_CLIENT_RATE_WINDOW:-60000}
      - AUTH_LOCK_TTL=${AUTH_LOCK_TTL:-10000}
      - AUTH_LOCK_RETRY_INTERVAL=${AUTH_LOCK_RETRY_INTERVAL:-25}
      - AUTH_LOCK_ACQUIRE_TIMEOUT=${AUTH_LOCK_ACQUIRE_TIMEOUT:-3000}
      - SOCIAL_LOGIN_REGISTRATION_MAX_ATTEMPTS=${SOCIAL_LOGIN_REGISTRATION_MAX_ATTEMPTS:-3}
      - AUTH_REDIS_KEY_PREFIX=${AUTH_REDIS_KEY_PREFIX:-moodtail:prod:auth:}

      - LOCAL_PASSWORD_MIN_LENGTH=${LOCAL_PASSWORD_MIN_LENGTH:-8}
      - LOCAL_PASSWORD_MAX_BYTES=${LOCAL_PASSWORD_MAX_BYTES:-72}
      - LOCAL_LOGIN_MAX_FAILED_ATTEMPTS=${LOCAL_LOGIN_MAX_FAILED_ATTEMPTS:-5}
      - LOCAL_LOGIN_LOCK_DURATION=${LOCAL_LOGIN_LOCK_DURATION:-900000}
      - PASSWORD_RESET_ENABLED=${PASSWORD_RESET_ENABLED:-false}
      - PASSWORD_RESET_PEPPER=${PASSWORD_RESET_PEPPER:-}
      - PASSWORD_RESET_CODE_EXPIRATION=${PASSWORD_RESET_CODE_EXPIRATION:-300000}
      - PASSWORD_RESET_TOKEN_EXPIRATION=${PASSWORD_RESET_TOKEN_EXPIRATION:-600000}
      - PASSWORD_RESET_RESEND_COOLDOWN=${PASSWORD_RESET_RESEND_COOLDOWN:-60000}
      - PASSWORD_RESET_MAX_VERIFY_ATTEMPTS=${PASSWORD_RESET_MAX_VERIFY_ATTEMPTS:-5}
      - PASSWORD_RESET_CLIENT_IP_HEADER=${PASSWORD_RESET_CLIENT_IP_HEADER:-}
      - PASSWORD_RESET_CLIENT_RATE_MAX_ATTEMPTS=${PASSWORD_RESET_CLIENT_RATE_MAX_ATTEMPTS:-10}
      - PASSWORD_RESET_CLIENT_RATE_WINDOW=${PASSWORD_RESET_CLIENT_RATE_WINDOW:-600000}
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-true}
      - MAIL_STARTTLS_ENABLED=${MAIL_STARTTLS_ENABLED:-true}
      - MAIL_CONNECTION_TIMEOUT=${MAIL_CONNECTION_TIMEOUT:-3000}
      - MAIL_READ_TIMEOUT=${MAIL_READ_TIMEOUT:-5000}
      - MAIL_WRITE_TIMEOUT=${MAIL_WRITE_TIMEOUT:-5000}

      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_MAX_AGE=${CORS_MAX_AGE:-3600}
      - USAGE_TIMEOUT=${USAGE_TIMEOUT}
    deploy:
      resources:
        limits:
          memory: 600M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
